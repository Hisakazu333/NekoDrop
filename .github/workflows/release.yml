name: Release

# 打 v* 标签时：双平台构建安装包并发布 GitHub Release。
# macOS: Apple Silicon DMG；Windows: x64 NSIS 安装包；附 SHA-256 校验和。
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DMG
        run: npm run tauri build
        working-directory: apps/desktop

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  macos-intel:
    # macos-13（Intel 机型）已退役且排队不消化：在 arm64 runner 上交叉编译 x86_64
    name: macOS DMG (Intel)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Intel DMG
        run: npm run tauri build -- --target x86_64-apple-darwin
        working-directory: apps/desktop

      - name: Upload Intel DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
        working-directory: apps/desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, macos-intel, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download macOS DMG (Apple Silicon)
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Download macOS DMG (Intel)
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-dmg
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Checkout (for release notes file)
        uses: actions/checkout@v4

      - name: Pick release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -f "docs/release-notes/v${TAG}.md" ]; then
            cp "docs/release-notes/v${TAG}.md" RELEASE_NOTES.md
            echo "using hand-written notes for v${TAG}"
          else
            printf '# NekoDrop %s\n\nNotes pending. See [commits](https://github.com/Hisakazu333/NekoDrop/commits/main) for details.' "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
            echo "no hand-written notes found for v${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/NekoDrop_*_aarch64.dmg
            dist/NekoDrop_*_x64.dmg
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
