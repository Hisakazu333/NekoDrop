[package]
name = "nekodrop-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nekobuddy-workspace-adapter = { path = "../../crates/nekobuddy-workspace-adapter" }
nekodrop-network = { path = "../../crates/nekodrop-network" }
nekodrop-service = { path = "../../crates/nekodrop-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "nekodrop-sidecar"
path = "src/main.rs"
