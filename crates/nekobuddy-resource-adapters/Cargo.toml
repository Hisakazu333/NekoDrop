[package]
name = "nekobuddy-resource-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nekodrop-core = { path = "../nekodrop-core" }
nekolink-adapter-contract = { path = "../nekolink-adapter-contract" }
nekolink-protocol = { path = "../nekolink-protocol" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[lib]
path = "src/lib.rs"
